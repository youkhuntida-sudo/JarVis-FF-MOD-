name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'templ'
          java-version: '17'

      - name: Build APK Placeholder
        run: |
          echo "Building JAR VIS MOD APK..."
          mkdir -p build/output
          echo "JarVis AI MOD APK" > build/output/JarVis_FreeFire_MOD.apk
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: JarVis-Mod-APK
          path: build/output/*.apk
